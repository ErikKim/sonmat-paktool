# paktool.exe: one self-contained Windows exe. Every push builds it (artifact); a tag v* also puts it on a release,
# which is where the app fetches it from (sonmat: data/fetch_tools.json, address + SHA-256).
name: build
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  paktool:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish
        run: dotnet publish paktool.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o out
      - name: SHA-256 (the value for sonmat's data/fetch_tools.json)
        shell: pwsh
        run: (Get-FileHash out/paktool.exe -Algorithm SHA256).Hash.ToLower()
      - uses: actions/upload-artifact@v4
        with:
          name: paktool
          path: out/paktool.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $hash = (Get-FileHash out/paktool.exe -Algorithm SHA256).Hash.ToLower()
          gh release create "${{ github.ref_name }}" out/paktool.exe LICENSE --title "paktool ${{ github.ref_name }}" --notes "SHA-256 $hash"
